<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - E-Commerce</title>
    <style>
        body { font-family: system-ui; background-color: #f7f8fa; padding: 20px; }
        nav { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #ddd; }
        nav a { margin-right: 15px; text-decoration: none; color: #1f2937; font-weight: bold; }
        .checkout-container { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #374151; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #15803d; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 1em; font-weight: bold; }
        button:hover { background-color: #166534; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="cart.html">Cart</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>

    <div class="checkout-container">
        <h2>Checkout Details</h2>
        <form id="checkout-form" onsubmit="handleCheckout(event)">
            <div class="form-group">
                <label for="address">Shipping Address</label>
                <textarea id="address" rows="3" required placeholder="Enter your full delivery address"></textarea>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" required placeholder="03001234567">
            </div>
            <button type="submit">Place Order</button>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script>
        async function handleCheckout(event) {
            event.preventDefault();
            
            const address = document.getElementById("address").value;
            const phone = document.getElementById("phone").value;

            if (!localStorage.getItem("access_token")) {
                alert("Please login first!");
                window.location.href = "login.html";
                return;
            }

            try {
                const orderData = {
                    shipping_address: address,
                    phone_number: phone
                };

                const response = await apiRequest("/orders/", {
                    method: "POST",
                    body: JSON.stringify(orderData)
                });

                alert("Order placed successfully!");
                window.location.href = "index.html";
            } catch (error) {
                alert("Checkout failed: " + error.message);
            }
        }

        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
